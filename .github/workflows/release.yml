name: Release TV build

# Every push to main ships a signed TV build, a GitHub release carrying it, and the signed update
# manifest the app already polls. Nothing here runs on a pull request: a release needs the version
# bump to be final and the secrets to be present.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, and never cancel one half-way: a cancelled run could leave a draft release
# with some assets and no manifest.
concurrency:
  group: release-tv
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          set -euo pipefail
          # GitHub expressions have no arithmetic, so the numbers are done here and handed on
          # through GITHUB_ENV. The base is the last version published by hand: 0.1.84, build 96.
          echo "APP_VERSION_CODE=$((96 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=0.1.$((84 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned, not inherited: the runner image moved to Python 3.14, which has no coincurve wheel,
      # and building it from source failed before the manifest could be signed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Not android-actions/setup-android: it installs its default `tools` package, which no longer
      # exists in Google's repository, and fails before Gradle is reached. The runner image already
      # carries an SDK with accepted licences, so this only has to point the build at it; AGP then
      # fetches the platform and build-tools the module pins.
      - name: Point the build at the runner's Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK" || { echo "No Android SDK at $SDK" >&2; exit 1; }
          echo "sdk.dir=$SDK" > local.properties
          echo "Using SDK at $SDK"

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > anilili-release.jks
          {
            echo 'storeFile=anilili-release.jks'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the TV release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleTvRelease --console=plain

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/tv/release
          gh release create "v$APP_VERSION_NAME" \
            "$OUT/Anilili_tv_armeabi-v7a.apk" \
            "$OUT/Anilili_tv_arm64-v8a.apk" \
            "$OUT/Anilili_tv.apk" \
            --draft \
            --title "$APP_VERSION_NAME" \
            --notes "Built from ${GITHUB_SHA:0:12}. APKs and the signed update manifest are attached."

      - name: Sign the update manifest
        env:
          NOSTR_UPDATE_SECRET: ${{ secrets.NOSTR_UPDATE_SECRET }}
        run: |
          set -euo pipefail
          python3 -m venv .venv-nostr
          .venv-nostr/bin/pip install --quiet -r scripts/requirements.txt
          OUT=app/build/outputs/apk/tv/release
          TV_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${APP_VERSION_NAME}/Anilili_tv.apk"
          SIZE=$(stat -c%s "$OUT/Anilili_tv.apk")
          # --dry-run only stops the relay broadcast: the signed event is what gets served from the
          # release as update.json, and it is verified by the app exactly as a relay copy would be.
          .venv-nostr/bin/python scripts/nostr_update.py publish \
            --version "$APP_VERSION_NAME" \
            --version-code "$APP_VERSION_CODE" \
            --apk-url "$TV_URL" \
            --size-bytes "$SIZE" \
            --tv-apk-url "$TV_URL" \
            --tv-size-bytes "$SIZE" \
            --changelog "Built from ${GITHUB_SHA:0:12}" \
            --dry-run \
            --write-event update.json

      - name: Attach the manifest and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "v$APP_VERSION_NAME" update.json
          gh release edit "v$APP_VERSION_NAME" --draft=false

      - name: Broadcast the manifest to the relays
        env:
          NOSTR_UPDATE_SECRET: ${{ secrets.NOSTR_UPDATE_SECRET }}
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/tv/release
          TV_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${APP_VERSION_NAME}/Anilili_tv.apk"
          SIZE=$(stat -c%s "$OUT/Anilili_tv.apk")
          # Relays are the durable copy the app falls back to when the release URL is unreachable.
          # A relay refusing the event is normal; the mirror above is already serving it.
          .venv-nostr/bin/python scripts/nostr_update.py publish \
            --version "$APP_VERSION_NAME" \
            --version-code "$APP_VERSION_CODE" \
            --apk-url "$TV_URL" \
            --size-bytes "$SIZE" \
            --tv-apk-url "$TV_URL" \
            --tv-size-bytes "$SIZE" \
            --changelog "Built from ${GITHUB_SHA:0:12}" \
            || echo "Relay broadcast failed; update.json in the release is authoritative."
